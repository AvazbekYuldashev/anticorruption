# Testlar uchun xotiradagi H2 (PostgreSQL rejimida) - haqiqiy baza kerak emas.
spring.datasource.url=jdbc:h2:mem:anticorruption;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Sinovlar xotiradagi H2 da ishlaydi: sxemani Hibernate yaratadi,
# PostgreSQL uchun yozilgan migratsiyalar bu yerda kerak emas.
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=test-secret-key-for-integration-tests-min-32-bytes
app.jwt.expiration=1h
app.jwt.issuer=anticorruption-api

app.cors.allowed-origins=http://localhost:3000

app.storage.location=target/test-uploads
app.storage.max-files-per-complaint=3
# Chegara testi arzon bo'lishi uchun ataylab kichik.
app.storage.max-images-per-news=3

# Sinovlar bir necha o'nlab so'rov yuboradi - chegara ularni to'sib qo'ymasin.
app.rate-limit.enabled=false

app.mail.enabled=false
app.public-url=http://localhost:8080

app.admin.email=admin@test.uz
app.admin.password=TestAdmin12345!
app.admin.full-name=Test administrator

logging.level.api.anticorruption=WARN
logging.level.org.hibernate=WARN
