# =============================================================================
# Ishlab chiqarish (production) sozlamalari.
#
# Ishga tushirish:  java -jar app.jar --spring.profiles.active=prod
#
# Maxfiy qiymatlar bu yerda YO'Q - ular muhit o'zgaruvchilari orqali beriladi:
#   DB_URL, DB_USERNAME, DB_PASSWORD
#   APP_JWT_SECRET (kamida 32 bayt), APP_POLL_SALT, APP_ADMIN_PASSWORD
#   APP_CORS_ORIGINS (masalan https://korrupsiya.astiedu.uz)
#
# Ularning biri ishlab chiqish qiymatida qolsa, ProductionSafetyCheck
# ilovani ishga tushirmaydi.
# =============================================================================

# ---------------------------------------------------------------------------
# Ma'lumotlar bazasi
# Sxemani Hibernate emas, migratsiyalar boshqaradi: "validate" faqat
# jadvallar entitylarga mos kelishini tekshiradi va hech narsani o'zgartirmaydi.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Ulanishlar hovuzi: bir vaqtda nechta so'rov bazaga borishi mumkin.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# ---------------------------------------------------------------------------
# Hujjatlar
# Swagger ochiq serverda API tuzilishini to'liq ko'rsatadi - yopiladi.
# ---------------------------------------------------------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---------------------------------------------------------------------------
# Server
# Ilova teskari proksi (nginx) ortida turadi: mijozning haqiqiy manzili va
# sxemasi X-Forwarded-* sarlavhalaridan olinadi.
# ---------------------------------------------------------------------------
server.forward-headers-strategy=framework
server.tomcat.max-http-form-post-size=60MB
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Javoblarni siqish - matn va JSON uchun sezilarli tejam.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# ---------------------------------------------------------------------------
# Loglar
# ---------------------------------------------------------------------------
logging.level.root=WARN
logging.level.api.anticorruption=INFO
logging.level.org.hibernate.SQL=WARN
logging.file.name=${LOG_FILE:logs/anticorruption.log}
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# ---------------------------------------------------------------------------
# Monitoring: faqat health, qolgan ko'rsatkichlar tashqariga chiqmaydi.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Seans cookie'lari: ishlab chiqarishda faqat HTTPS ustida yuboriladi.
# Frontend API dan boshqa domenda tursa APP_COOKIE_SAME_SITE=None qo'ying -
# u secure=true bo'lgandagina ishlaydi.
# ---------------------------------------------------------------------------
app.auth.secure=true
app.auth.same-site=${APP_COOKIE_SAME_SITE:Lax}

# ---------------------------------------------------------------------------
# So'rov chegarasi (bitta IP uchun)
# ---------------------------------------------------------------------------
app.rate-limit.enabled=true
app.rate-limit.requests=${RATE_LIMIT_REQUESTS:30}
app.rate-limit.window=${RATE_LIMIT_WINDOW:1m}
# Bir nechta nusxa ishlayotgan bo'lsa APP_RATE_LIMIT_STORE=redis qo'ying.
app.rate-limit.store=${APP_RATE_LIMIT_STORE:memory}

# ---------------------------------------------------------------------------
# Antivirus: serverda clamav-daemon o'rnatilgan bo'lsa yoqing.
# ---------------------------------------------------------------------------
app.antivirus.enabled=${APP_ANTIVIRUS_ENABLED:false}
app.antivirus.fail-closed=${APP_ANTIVIRUS_FAIL_CLOSED:true}

# ---------------------------------------------------------------------------
# Fayllar: yuklangan fayllar jar bilan bir joyda emas, alohida papkada
# saqlanishi kerak - shunda yangilanish ularni o'chirib yubormaydi.
# ---------------------------------------------------------------------------
app.storage.location=${APP_STORAGE_LOCATION:/var/lib/anticorruption/uploads}
