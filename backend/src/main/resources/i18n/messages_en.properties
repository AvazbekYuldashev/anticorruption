# =============================================================================
# English.
# Contractions are avoided on purpose: lines containing {0} placeholders pass
# through MessageFormat, where a single quote is a special character and would
# have to be doubled. Writing "does not" instead of "doesn't" keeps that trap
# out of the file entirely.
# =============================================================================

