spring.application.name=anticorruption
server.port=8080

# ---------------------------------------------------------------------------
# Mahalliy sozlamalar fayli (agar mavjud bo'lsa) shu yerdagi qiymatlarni
# almashtiradi. U .gitignore da - parollar repoga tushmasligi uchun.
# ---------------------------------------------------------------------------
spring.config.import=optional:classpath:application-local.properties

# ---------------------------------------------------------------------------
# Ma'lumotlar bazasi (PostgreSQL)
# Bazani oldindan yaratish kerak:  CREATE DATABASE anticorruption;
#
# Parolni bu faylga YOZMANG. Ikkita xavfsiz yo'l bor:
#   1) src/main/resources/application-local.properties fayliga yozing;
#   2) yoki DB_URL / DB_USERNAME / DB_PASSWORD muhit o'zgaruvchilarini bering.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/anticorruption}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Sxemani Flyway migratsiyalari boshqaradi (src/main/resources/db/migration).
# Hibernate faqat tekshiradi: entity va jadval mos kelmasa ilova ishga
# tushmaydi - bu nomuvofiqlikni ish paytida emas, darrov ko'rsatadi.
#
# Entity o'zgartirilsa yangi migratsiya fayli yozilishi kerak (V2__...sql).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# Mavjud (migratsiyasiz yaratilgan) bazani birinchi ishga tushishda
# birinchi versiya sifatida belgilab qo'yadi - jadvallar qaytadan
# yaratilmaydi.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# JWT
# Kalit kamida 32 bayt bo'lishi shart. Ishlab chiqarishda APP_JWT_SECRET
# muhit o'zgaruvchisi orqali boshqa kalit berilishi SHART.
# ---------------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-key-change-me-in-production-32bytes-min}
# Kirish tokenini bekor qilib bo'lmaydi - shuning uchun u qisqa muddatli.
# Seans esa yangilash tokeni hisobiga uzoq davom etadi.
app.jwt.expiration=15m
app.jwt.refresh-expiration=14d
app.jwt.issuer=anticorruption-api

# ---------------------------------------------------------------------------
# Seans cookie'lari
#
# Ikkala token ham HttpOnly cookie'da beriladi: sahifadagi JavaScript ularga
# kira olmaydi, ya'ni XSS orqali o'g'irlanmaydi. Buning evaziga yozuv
# so'rovlari CSRF tokenini talab qiladi (XSRF-TOKEN cookie -> X-XSRF-TOKEN
# sarlavhasi).
#
# secure=true faqat HTTPS ustida ishlaydi - shuning uchun ishlab chiqishda
# false, ishlab chiqarishda esa har doim true (application-prod.properties).
#
# same-site: frontend va API bitta domenda bo'lsa "Lax" yetarli. Ular
# boshqa-boshqa domenda tursa "None" kerak bo'ladi va u faqat secure=true
# bilan birga ishlaydi.
# ---------------------------------------------------------------------------
app.auth.access-cookie=${APP_ACCESS_COOKIE:ac_access}
app.auth.refresh-cookie=${APP_REFRESH_COOKIE:ac_refresh}
app.auth.secure=${APP_COOKIE_SECURE:false}
app.auth.same-site=${APP_COOKIE_SAME_SITE:Lax}
app.auth.refresh-cookie-path=/api/v1/auth

# ---------------------------------------------------------------------------
# CORS - frontend qaysi manzillardan murojaat qilishi mumkin
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# ---------------------------------------------------------------------------
# Fayl biriktirish
# ---------------------------------------------------------------------------
app.storage.location=${APP_STORAGE_LOCATION:uploads}
app.storage.max-files-per-complaint=5
app.storage.max-images-per-news=20
app.storage.allowed-content-types=image/jpeg,image/png,image/webp,application/pdf,text/plain
spring.servlet.multipart.max-file-size=10MB
# So'rov chegarasi kattaroq: yangilik albomiga bir vaqtda bir nechta rasm yuklanadi.
spring.servlet.multipart.max-request-size=60MB

# ---------------------------------------------------------------------------
# Antivirus (ClamAV)
#
# Standart holatda o'chiq: ishlab chiqish uchun ClamAV o'rnatish shart emas.
# Yoqilsa, yuklangan har bir fayl clamd ga yuboriladi (INSTREAM) va zararli
# fayl saqlanmasdan o'chiriladi.
#
# fail-closed=true: clamd javob bermasa fayl qabul qilinmaydi. Tekshirilmagan
# faylni o'tkazib yuborish antivirusni yoqishning ma'nosini yo'qotardi.
# Agar murojaat yuborish uzilib qolgani xavfliroq deb hisoblasangiz, uni
# false qiling - shunda fayl o'tadi va logga ogohlantirish yoziladi.
#
# Server tomonida:  apt install clamav-daemon  (port 3310)
# ---------------------------------------------------------------------------
app.antivirus.enabled=${APP_ANTIVIRUS_ENABLED:false}
app.antivirus.host=${APP_ANTIVIRUS_HOST:127.0.0.1}
app.antivirus.port=${APP_ANTIVIRUS_PORT:3310}
app.antivirus.timeout=30s
app.antivirus.fail-closed=${APP_ANTIVIRUS_FAIL_CLOSED:true}

# ---------------------------------------------------------------------------
# So'rovnomalar
# Tuz ovoz beruvchi belgisini xeshlashda ishlatiladi. O'zgartirilsa
# oldingi ovoz berganlar qayta ovoz bera oladi.
# ---------------------------------------------------------------------------
app.poll.vote-salt=${APP_POLL_SALT:dev-only-poll-salt-change-me-in-production}

# ---------------------------------------------------------------------------
# So'rov chegarasi: bitta IP dan ochiq yozuv amallari (kirish, murojaat
# yuborish, ovoz berish) uchun. Sinovda xalaqit bermasligi uchun chegara
# keng qo'yilgan; ishlab chiqarish qiymatlari application-prod.properties da.
# ---------------------------------------------------------------------------
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.requests=${APP_RATE_LIMIT_REQUESTS:60}
app.rate-limit.window=${APP_RATE_LIMIT_WINDOW:1m}

# Hisob qayerda yuritiladi: "memory" (bitta nusxa) yoki "redis" (umumiy).
# Redis sozlanmagan bo'lsa xotiraga qaytiladi va bu haqda ogohlantirish yoziladi.
app.rate-limit.store=${APP_RATE_LIMIT_STORE:memory}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Parol kerak bo'lsa REDIS_PASSWORD bering:
# spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2s

# ---------------------------------------------------------------------------
# Email xabarnomalar
# SMTP sozlanmaguncha xatlar yuborilmaydi, faqat logga yoziladi.
# ---------------------------------------------------------------------------
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@anticorruption.uz}
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------------
# Birinchi ishga tushirishda yaratiladigan administrator
# ---------------------------------------------------------------------------
app.admin.email=${APP_ADMIN_EMAIL:admin@anticorruption.uz}
app.admin.password=${APP_ADMIN_PASSWORD:Admin12345!}
app.admin.full-name=Bosh administrator

# ---------------------------------------------------------------------------
# Birinchi ishga tushirishda yaratiladigan moderator
# Majburiy emas: email yoki parolni bo'sh qoldirsangiz yaratilmaydi.
# ---------------------------------------------------------------------------
app.moderator.email=${APP_MODERATOR_EMAIL:moderator@anticorruption.uz}
app.moderator.password=${APP_MODERATOR_PASSWORD:Moderator12345!}
app.moderator.full-name=Moderator xodim

# ---------------------------------------------------------------------------
# Swagger / OpenAPI
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# ---------------------------------------------------------------------------
# Xatoliklar: mijozga ichki tafsilotlar chiqmasin
# (o'zbekcha xabarlar GlobalExceptionHandler orqali beriladi)
# ---------------------------------------------------------------------------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------------------
# Loglar
# ---------------------------------------------------------------------------
logging.level.api.anticorruption=INFO
logging.level.org.hibernate.SQL=WARN
